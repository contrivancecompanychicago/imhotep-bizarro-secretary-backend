[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imhotep-bizarro-secretary-backend"
version = "0.1.0"
description = "IMHOTEP Bizarros medical secretary backend and knowledge-graph package for Chicago Type 2 Diabetes care coordination."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn==0.30.6",
  "pydantic==2.9.2",
  "pypdf==5.1.0",
  "rdflib==7.1.0",
  "python-multipart==0.0.9",
]

[tool.setuptools]
packages = ["imhotep_bizarro_secretary_backend"]

[tool.setuptools.package-dir]
"" = "."
